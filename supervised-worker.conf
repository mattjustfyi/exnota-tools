# Why this is needed:
#
# Laravel workers are not designed to be long-running processes. For example,
# they will exit if a job times out.
#
# So we use Supervisor to restart workers when they exit.

[supervisord]
nodaemon=true

[program:worker-default]
process_name=%(program_name)s_%(process_num)02d
# TODO: Other things?: --sleep=3 --tries=3 --max-time=3600
command=php /var/www/html/artisan queue:work -v --timeout=30 --queue=default
autostart=true
autorestart=true
# stopasgroup=true
# killasgroup=true
user=root
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-default.log
# From Laravel docs:
# "You should ensure that the value of stopwaitsecs is greater than the number of
# seconds consumed by your longest running job. Otherwise, Supervisor may kill
# the job before it is finished processing."
stopwaitsecs=3600

[program:worker-delete-1]
process_name=%(program_name)s_%(process_num)02d
# TODO: Other things?: --sleep=3 --tries=3 --max-time=3600
command=php /var/www/html/artisan queue:work -v --timeout=30 --queue=delete-1
autostart=true
autorestart=true
# stopasgroup=true
# killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-delete-1.log
# From Laravel docs:
# "You should ensure that the value of stopwaitsecs is greater than the number of
# seconds consumed by your longest running job. Otherwise, Supervisor may kill
# the job before it is finished processing."
stopwaitsecs=3600