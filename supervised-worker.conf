# Why this is needed:
#
# Laravel workers are not designed to be long-running processes. For example,
# they will exit if a job times out.
#
# So we use Supervisor to restart workers when they exit.

[supervisord]
nodaemon=true

[program:worker-default]
process_name=%(program_name)s_%(process_num)02d
# [timeout]: From Laravel docs: https://laravel.com/docs/11.x/queues#job-expirations-and-timeouts
#
# "The --timeout value should always be at least several seconds shorter than
# your retry_after configuration value. This will ensure that a worker
# processing a frozen job is always terminated before the job is retried. If
# your --timeout option is longer than your retry_after configuration value,
# your jobs may be processed twice."
#
# Keep these aligned: timeout, retry_after, and stopwaitsecs.
#
# [max-time]: Exit every 60 minutes to avoid memory leaks. We haven't had an issue
# but it's probably a good default.
command=php /var/www/html/artisan queue:work -vvv --queue=default --timeout=180 --max-time=3600
autostart=true
autorestart=true
# stopasgroup=true
# killasgroup=true
user=root
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-default.log
# From Laravel docs:
# "You should ensure that the value of stopwaitsecs is greater than the number of
# seconds consumed by your longest running job. Otherwise, Supervisor may kill
# the job before it is finished processing."
#
# Keep these aligned: timeout, retry_after, and stopwaitsecs.
stopwaitsecs=190

[program:worker-delete-1]
process_name=%(program_name)s_%(process_num)02d
# [Sleep]: Delete jobs are a lower priority and take longer, so might be
# beneficial to sleep between, to save database connections. Haven't had an
# issue yet though.
command=php /var/www/html/artisan queue:work -vvv --queue=delete-1 --timeout=180 --max-time=3600 --sleep=3
autostart=true
autorestart=true
user=root
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-delete-1.log
stopwaitsecs=190

[program:worker-delete-2]
process_name=%(program_name)s_%(process_num)02d
# [Sleep]: Delete jobs are a lower priority and take longer, so might be
# beneficial to sleep between, to save database connections. Haven't had an
# issue yet though.
command=php /var/www/html/artisan queue:work -vvv --queue=delete-2 --timeout=180 --max-time=3600 --sleep=3
autostart=true
autorestart=true
user=root
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-delete-2.log
stopwaitsecs=190