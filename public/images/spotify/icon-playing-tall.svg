<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <style>
    .wave {
      animation: wave 1s ease-in-out infinite alternate;
      transform-origin: center;
    }
    @keyframes wave {
      0% { transform: scaleY(0.5); }
      100% { transform: scaleY(1); }
    }
  </style>
  
  <!-- Background -->
  <rect x="0" y="0" width="50" height="50" rx="10" ry="10" fill="#8447FF" />
  
  <rect class="wave" x="7.5" y="25" width="5" height="20" fill="white">
    <animate attributeName="height" values="20;30;20" dur="0.8s" repeatCount="indefinite" />
    <animate attributeName="y" values="15;10;15" dur="0.8s" repeatCount="indefinite" />
  </rect>
  
  <rect class="wave" x="17.5" y="25" width="5" height="30" fill="white">
    <animate attributeName="height" values="30;40;30" dur="1s" repeatCount="indefinite" />
    <animate attributeName="y" values="10;5;10" dur="1s" repeatCount="indefinite" />
  </rect>
  
  <rect class="wave" x="27.5" y="25" width="5" height="10" fill="white">
    <animate attributeName="height" values="10;25;10" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="y" values="20;12.5;20" dur="1.2s" repeatCount="indefinite" />
  </rect>
  
  <rect class="wave" x="37.5" y="25" width="5" height="25" fill="white">
    <animate attributeName="height" values="25;35;25" dur="0.9s" repeatCount="indefinite" />
    <animate attributeName="y" values="12.5;7.5;12.5" dur="0.9s" repeatCount="indefinite" />
  </rect>
</svg>