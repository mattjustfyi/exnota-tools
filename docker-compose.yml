#         env_file:
#             - .env
#         environment:
#             # When using Sail, `localhost` alone is fine. But via docker-compose
#             # we need port 8000.
#             APP_URL: 'http://localhost:8000'
#             ASSET_URL: 'http://localhost:8000'
#         ports:
#             - "8000:80"
