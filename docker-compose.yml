#             - 'host.docker.internal:host-gateway'

    # Uses ./Dockerfile to mimic prod environment
    # laravel.prod.workers:
    #     container_name: exnota-tools-prod-workers
    #     image: app-name:latest
    #     build:
    #         target: prod
